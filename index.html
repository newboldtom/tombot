<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Tombot</title>
<style>
  :root{
    --sky: #EAF6FB;
    --sky-deep: #D9EFF9;
    --tom-body: #FFB84C;
    --tom-body-dark: #F2A62F;
    --tom-cheek: #FF8C69;
    --ink: #2E3A59;
    --listen-glow: #7FD8BE;
    --speak-glow: #FFD873;
    --error-glow: #FF9E9E;
    --shadow: rgba(46,58,89,0.15);
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    overflow:hidden;
    background: radial-gradient(ellipse at 50% 20%, var(--sky-deep), var(--sky) 70%);
    font-family: ui-rounded, "SF Pro Rounded", "Segoe UI Rounded", system-ui, -apple-system, "Segoe UI", sans-serif;
    -webkit-tap-highlight-color: transparent;
    user-select: none;
    touch-action: manipulation;
  }
  #stage{
    position:relative;
    width:100%; height:100%;
    display:flex; align-items:center; justify-content:center;
    flex-direction:column;
  }

  /* ambient rings behind Tombot, communicate state without text */
  .ring{
    position:absolute;
    border-radius:50%;
    pointer-events:none;
    opacity:0;
    transition: opacity .4s ease;
  }
  .ring1{ width:340px; height:340px; }
  .ring2{ width:420px; height:420px; }

  #tombot-wrap{
    position:relative;
    width:260px; height:260px;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }

  #tombot{
    width:220px; height:220px;
    animation: breathe 3.4s ease-in-out infinite;
    transform-origin: center bottom;
  }
  @keyframes breathe{
    0%,100%{ transform: translateY(0) scale(1); }
    50%{ transform: translateY(-6px) scale(1.015); }
  }

  #floor-shadow{
    width:170px; height:26px;
    background: var(--shadow);
    border-radius:50%;
    margin-top:8px;
    filter: blur(2px);
    animation: shadowpulse 3.4s ease-in-out infinite;
  }
  @keyframes shadowpulse{
    0%,100%{ transform: scale(1); opacity:1; }
    50%{ transform: scale(0.88); opacity:0.7; }
  }

  /* state: listening */
  .st-listening .ring1{ opacity:1; background: radial-gradient(circle, rgba(127,216,190,0.35), transparent 70%); animation: pulse 1.6s ease-out infinite; }
  .st-listening .ring2{ opacity:1; background: radial-gradient(circle, rgba(127,216,190,0.18), transparent 70%); animation: pulse 1.6s ease-out .3s infinite; }
  @keyframes pulse{
    0%{ transform: scale(0.75); opacity:0.9; }
    100%{ transform: scale(1.15); opacity:0; }
  }
  .st-listening #tombot{ animation: breathe 1.1s ease-in-out infinite; }

  /* state: thinking */
  .st-thinking .ring1{ opacity:1; background: radial-gradient(circle, rgba(255,184,76,0.28), transparent 70%); animation: spin-ring 2.2s linear infinite; }
  @keyframes spin-ring{ 100%{ transform: rotate(360deg); } }

  /* state: speaking */
  .st-speaking .ring1{ opacity:1; background: radial-gradient(circle, rgba(255,216,115,0.4), transparent 70%); animation: pulse 0.9s ease-out infinite; }

  /* state: error */
  .st-error .ring1{ opacity:1; background: radial-gradient(circle, rgba(255,158,158,0.35), transparent 70%); }

  /* letter reveal tray */
  #letter-tray{
    position:absolute;
    bottom: 8%;
    left:50%;
    transform: translateX(-50%);
    display:flex;
    gap: 10px;
    pointer-events:none;
  }
  .letter-tile{
    width:56px; height:64px;
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 6px 14px var(--shadow);
    display:flex; align-items:center; justify-content:center;
    font-size: 32px;
    font-weight: 800;
    color: var(--ink);
    opacity:0;
    transform: translateY(20px) scale(0.6);
    animation: tile-in .45s cubic-bezier(.34,1.56,.64,1) forwards;
  }
  @keyframes tile-in{
    to{ opacity:1; transform: translateY(0) scale(1); }
  }

  /* tiny adult-facing caption, unobtrusive corner, never required for the child */
  #adult-note{
    position:absolute;
    bottom: 14px;
    right: 16px;
    font-size: 11px;
    color: #9AA7C2;
    max-width: 220px;
    text-align:right;
    line-height:1.4;
  }
</style>
</head>
<body>
  <div id="stage">
    <div class="ring ring2"></div>
    <div class="ring ring1"></div>
    <div id="tombot-wrap">
      <svg id="tombot" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
        <!-- antenna -->
        <line x1="70" y1="38" x2="60" y2="14" stroke="var(--tom-body-dark)" stroke-width="6" stroke-linecap="round"/>
        <line x1="130" y1="38" x2="140" y2="14" stroke="var(--tom-body-dark)" stroke-width="6" stroke-linecap="round"/>
        <circle id="ant-l" cx="60" cy="12" r="9" fill="var(--listen-glow)"/>
        <circle id="ant-r" cx="140" cy="12" r="9" fill="var(--listen-glow)"/>
        <!-- body -->
        <rect x="40" y="36" width="120" height="120" rx="42" fill="var(--tom-body)"/>
        <!-- cheeks -->
        <circle cx="58" cy="118" r="12" fill="var(--tom-cheek)" opacity="0.55"/>
        <circle cx="142" cy="118" r="12" fill="var(--tom-cheek)" opacity="0.55"/>
        <!-- eyes -->
        <g id="eyes">
          <circle cx="76" cy="92" r="13" fill="var(--ink)"/>
          <circle cx="124" cy="92" r="13" fill="var(--ink)"/>
          <circle cx="80" cy="88" r="3.5" fill="#fff"/>
          <circle cx="128" cy="88" r="3.5" fill="#fff"/>
        </g>
        <!-- mouth -->
        <path id="mouth" d="M 82 128 Q 100 138 118 128" stroke="var(--ink)" stroke-width="6" stroke-linecap="round" fill="none"/>
      </svg>
    </div>
    <div id="floor-shadow"></div>
    <div id="letter-tray"></div>
    <div id="adult-note">Tap Tombot to ask, tap again to stop.</div>
  </div>

<script>
(function(){
  const stage = document.getElementById('stage');
  const wrap = document.getElementById('tombot-wrap');
  const mouth = document.getElementById('mouth');
  const antL = document.getElementById('ant-l');
  const antR = document.getElementById('ant-r');
  const tray = document.getElementById('letter-tray');
  const adultNote = document.getElementById('adult-note');

  let state = 'idle'; // idle | listening | thinking | speaking | error
  let recognition = null;
  let recognitionSupported = true;

  function setState(next){
    state = next;
    stage.className = '';
    if(next !== 'idle') stage.classList.add('st-' + next);
    antL.style.fill = (next === 'listening') ? 'var(--listen-glow)' : 'var(--tom-body-dark)';
    antR.style.fill = (next === 'listening') ? 'var(--listen-glow)' : 'var(--tom-body-dark)';
    if(next === 'error'){
      mouth.setAttribute('d','M 84 132 Q 100 122 116 132');
    } else if(next !== 'speaking'){
      mouth.setAttribute('d','M 82 128 Q 100 138 118 128');
    }
  }

  // --- Speech recognition setup ---
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(SR){
    recognition = new SR();
    recognition.lang = 'en-GB';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    recognition.continuous = false;

    recognition.onresult = function(e){
      const transcript = e.results[0][0].transcript;
      setState('thinking');
      askTombot(transcript);
    };
    recognition.onerror = function(e){
      if(e.error === 'no-speech'){
        setState('idle');
        return;
      }
      setState('error');
      if(e.error === 'not-allowed' || e.error === 'service-not-allowed'){
        adultNote.textContent = 'Microphone blocked. Open Tombot in its own browser tab and allow the microphone.';
      } else {
        adultNote.textContent = 'Tombot had trouble listening. Tap to try again.';
      }
      setTimeout(function(){ setState('idle'); }, 2200);
    };
    recognition.onend = function(){
      if(state === 'listening'){
        setState('idle');
      }
    };
  } else {
    recognitionSupported = false;
  }

  wrap.addEventListener('click', function(){
    if(!recognitionSupported){
      setState('error');
      adultNote.textContent = 'This browser cannot listen. Please use Chrome.';
      setTimeout(function(){ setState('idle'); }, 2500);
      return;
    }
    if(state === 'idle'){
      clearTray();
      window.speechSynthesis.cancel();
      try{
        recognition.start();
        setState('listening');
      }catch(err){
        setState('idle');
      }
    } else if(state === 'listening'){
      recognition.stop();
    } else if(state === 'speaking' || state === 'thinking'){
      window.speechSynthesis.cancel();
      setState('idle');
    }
  });

  function clearTray(){
    tray.innerHTML = '';
  }

  // --- Ask Tombot's own backend (which holds the API key securely) ---
  async function askTombot(question){
    try{
      const response = await fetch("/api/ask", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ question: question })
      });
      if(!response.ok){
        throw new Error('Backend returned ' + response.status);
      }
      const parsed = await response.json();
      speakAnswer(parsed);
    }catch(err){
      setState('error');
      adultNote.textContent = 'Tombot could not think of an answer just then.';
      setTimeout(function(){ setState('idle'); }, 2200);
    }
  }

  // --- Pick the most natural-sounding voice available on this device ---
  let cachedVoice = null;
  let voicesReady = false;
  function refreshVoices(){
    const voices = window.speechSynthesis.getVoices();
    if(!voices || !voices.length) return;
    voicesReady = true;
    // Prefer high-quality/natural-sounding engines first, then any UK English voice,
    // then any English voice, then whatever the browser defaults to.
    const byScore = voices
      .map(function(v){
        let score = 0;
        const name = v.name.toLowerCase();
        if(name.includes('natural')) score += 5;
        if(name.includes('google')) score += 3;
        if(name.includes('neural') || name.includes('online')) score += 3;
        if(v.lang === 'en-GB') score += 2;
        else if(v.lang && v.lang.startsWith('en')) score += 1;
        return { voice: v, score: score };
      })
      .sort(function(a, b){ return b.score - a.score; });
    cachedVoice = byScore.length ? byScore[0].voice : null;
  }
  refreshVoices();
  if(window.speechSynthesis.onvoiceschanged !== undefined){
    window.speechSynthesis.onvoiceschanged = refreshVoices;
  }

  // --- Speak the answer ---
  function speakAnswer(answer){
    setState('speaking');
    if(!voicesReady) refreshVoices();
    const utter = new SpeechSynthesisUtterance(answer.spoken || '');
    if(cachedVoice){
      utter.voice = cachedVoice;
      utter.lang = cachedVoice.lang;
    } else {
      utter.lang = 'en-GB';
    }
    utter.rate = 0.92;
    utter.pitch = 1.05;

    let mouthTimer = setInterval(function(){
      const open = Math.random() > 0.4;
      mouth.setAttribute('d', open
        ? 'M 80 126 Q 100 146 120 126'
        : 'M 82 130 Q 100 134 118 130');
    }, 140);

    utter.onend = function(){
      clearInterval(mouthTimer);
      mouth.setAttribute('d','M 82 128 Q 100 138 118 128');
      if(answer.letters && answer.letters.length){
        revealLetters(answer.letters);
      } else {
        setState('idle');
      }
    };
    utter.onerror = function(){
      clearInterval(mouthTimer);
      setState('idle');
    };

    window.speechSynthesis.speak(utter);
  }

  function revealLetters(letters){
    setState('thinking');
    clearTray();
    letters.forEach(function(letter, i){
      setTimeout(function(){
        const tile = document.createElement('div');
        tile.className = 'letter-tile';
        tile.textContent = letter;
        tray.appendChild(tile);
        if(i === letters.length - 1){
          setTimeout(function(){
            setState('idle');
          }, 900);
        }
      }, i * 420);
    });
  }

  setState('idle');
})();
</script>
</body>
</html>
